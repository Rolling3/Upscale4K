name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "beta*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; jobs that publish ask for more themselves.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: tests

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg

      - name: ffmpeg version
        shell: bash
        run: |
          ffmpeg -hide_banner -version
          echo "::notice::ffmpeg used by the tests: $(command -v ffmpeg)"

      - name: Core unit tests (domain and application)
        run: cargo test --locked -p upscale4k-domain -p upscale4k-application

      # Failing lines are repeated as annotations, so they show on the run page.
      - name: Infrastructure unit and integration tests (real ffmpeg)
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p upscale4k-infrastructure 2>&1 | tee test-output.txt && exit 0
          code=$?
          { grep -E "panicked|FAILED|^error|left:|right:|exit code|didn't exit" test-output.txt || true; } | head -n 40 |
            while IFS= read -r line; do echo "::error::${line}"; done
          echo "::error::cargo test exited with code ${code}"
          exit "$code"

  # One draft release per tag, created before the parallel builds upload to it.
  release:
    name: Create draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BODY: |
            Download the file for your computer:
            - Windows: `Upscale4K_<version>_x64-setup.exe`
            - macOS on Apple Silicon (M1 and later): `Upscale4K_<version>_aarch64.dmg`
            - macOS on Intel: `Upscale4K_<version>_x64.dmg`

            Upscale4K needs ffmpeg. Windows: `winget install --id Gyan.FFmpeg -e`. macOS: `brew install ffmpeg`.
            The Windows installer and the macOS app are not code-signed by a paid certificate. See the README for the first-launch steps.
        run: |
          # "beta" tags are published as pre-releases named "Upscale4K Beta".
          case "$TAG" in
            beta*) name="Upscale4K Beta${TAG#beta}"; prerelease=true ;;
            *) name="Upscale4K $TAG"; prerelease=false ;;
          esac
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id' | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f name="$name" -f body="$BODY" \
              -F draft=true -F prerelease="$prerelease" --jq .id)
          fi
          case "$id" in
            ''|*[!0-9]*) echo "Unexpected release id: $id" >&2; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [test, release]
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check the interface
        run: npm run typecheck

      # The macOS app is ad-hoc signed (bundle.macOS.signingIdentity "-" in tauri.conf.json).
      # On tags the bundles go to the draft release; manual runs keep them as workflow artifacts.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true

  # The draft becomes public only when every build has uploaded its file.
  # When a tag is pushed again, the release published earlier for it stays up
  # until this point and is then replaced by the new one.
  publish:
    name: Publish release
    needs: [release, build]
    if: needs.release.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
          TAG: ${{ github.ref_name }}
        run: |
          earlier=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG and (.draft | not)) | .id')
          for old in $earlier; do
            [ "$old" = "$ID" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${old}"
            echo "Replaced the earlier release ${old}"
          done
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" -F draft=false --jq .html_url
